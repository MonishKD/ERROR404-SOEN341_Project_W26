<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealMajor - Meal Planner</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="user-profile-styles.css">
        <link rel="stylesheet" href="home-styles.css">
        <link rel="stylesheet" href="profile-styles.css">
        <link rel="stylesheet" href="planner-styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <script type="module" src="script-meal-planner.js" defer></script>
</head>
<body>

    <!--Navigation bar-->
    <nav class="navbar">
        <div class="nav-container">
            <a href="home-page.html" class="nav-brand">
                <span class="brand-icon">🍴</span>
                <span class="brand-name">MealMajor</span>
            </a>
            <div class="nav-links">
                <a href="home-page.html" class="nav-link">Home</a>
                <a href="recipes.html" class="nav-link">Recipes</a>
                <a href="meal-planner.html" class="nav-link active">Meal Planner</a>
                <a href="edit-profile.html" class="nav-link">Profile</a>
                <a href="user-profile.html" class="nav-link nav-avatar">
                    <div class="avatar-circle" id="avatarNav"></div>
                </a>
                <a href="login-page.html" class="nav-link logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="profile-container">

        <!--Page header-->
        <div class="profile-header">
            <h1>📅 Weekly Meal Planner</h1>
            <p>Plan your meals for the week ahead</p>
        </div>

        <!--Week controls-->
        <div class="planner-controls">
            <div class="planner-week-row">
                <button class="week-nav-btn">&#8249;</button>
                <div class="planner-week-label" id="mealplanWeekDate">
                    <span class="week-month">March 2026</span>
                    <span class="week-range">Mar 17 - Mar 23</span>
                </div>
                <button class="week-nav-btn">&#8250;</button>
                <input type="date" id="weekPicker" class="week-date-input">
                <!--<div class="planner-actions-row">
                    <button class="planner-clear-btn">🗑️ Clear All</button>
                </div> -->
            </div>
        </div>    
        
        <!--Weekly grid-->
        <div class="planner-grid-wrapper">
            <div class="planner-grid"></div>
        </div>        

    </div>

</body>
</html>
