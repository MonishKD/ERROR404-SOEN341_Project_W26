<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealMajor - Reset Password</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="page">
        <div class="card">
            <div class="card-header">
                <div class="overlay">
                    <div class="header-icon">🔐</div>
                    <h1>Create a New Password</h1>
                    <p>Choose a secure password for your account</p>
                </div>
            </div>

            <div class="card-body">
                <p class="subtitle">Enter your new password below</p>

                <form id="resetPasswordForm">
                    <label for="password">New Password</label>
                    <div class="password-wrapper">
                        <input id="password" name="password" type="password" placeholder="Enter a new password" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="password">👁</button>
                    </div>
                    <small class="error" id="passwordError"></small>

                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="password-wrapper">
                        <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm your new password" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="confirmPassword">👁</button>
                    </div>
                    <small class="error" id="confirmPasswordError"></small>

                    <button class="cssbuttons-io-button" type="submit">
                        <span>Reset Password</span>
                    </button>
                </form>

                <div id="message" style="display: none; padding: 15px; border-radius: 8px; margin-top: 20px;"></div>

                <p class="create">
                    <a href="/pages/login-page.html">← Back to Login</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('resetPasswordForm');
        const messageDiv = document.getElementById('message');
        const token = new URLSearchParams(window.location.search).get('token');

        function showError(id, message) {
            const element = document.getElementById(id);
            element.textContent = message;
        }

        function clearErrors() {
            document.querySelectorAll('.error').forEach((element) => {
                element.textContent = '';
            });
        }

        function showMessage(message, isSuccess) {
            messageDiv.style.display = 'block';
            messageDiv.style.background = isSuccess ? '#e6f4ec' : '#fee';
            messageDiv.style.color = isSuccess ? '#0e9c50' : '#dc2626';
            messageDiv.textContent = message;
        }

        document.querySelectorAll('.toggle-password').forEach((button) => {
            button.addEventListener('click', () => {
                const target = document.getElementById(button.dataset.target);
                target.type = target.type === 'password' ? 'text' : 'password';
            });
        });

        async function validateToken() {
            if (!token) {
                form.style.display = 'none';
                showMessage('This reset link is invalid or missing a token.', false);
                return;
            }

            try {
                const response = await fetch(`/api/auth/validate-reset-token?token=${encodeURIComponent(token)}`);
                const data = await response.json();

                if (!response.ok || !data.valid) {
                    form.style.display = 'none';
                    showMessage(data.message || 'This reset link is invalid or expired.', false);
                }
            } catch (error) {
                form.style.display = 'none';
                showMessage('Unable to validate the reset link right now. Please try again later.', false);
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            clearErrors();
            messageDiv.style.display = 'none';

            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();
            const submitButton = form.querySelector('button[type="submit"]');

            let hasError = false;

            if (!password) {
                showError('passwordError', 'Password is required');
                hasError = true;
            } else if (password.length < 8) {
                showError('passwordError', 'Password must be at least 8 characters');
                hasError = true;
            }

            if (!confirmPassword) {
                showError('confirmPasswordError', 'Please confirm your password');
                hasError = true;
            } else if (password !== confirmPassword) {
                showError('confirmPasswordError', 'Passwords do not match');
                hasError = true;
            }

            if (hasError) {
                return;
            }

            submitButton.disabled = true;
            submitButton.innerHTML = '<span>Resetting...</span>';

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showMessage(data.message || 'Unable to reset password.', false);
                    return;
                }

                form.reset();
                showMessage(data.message || 'Password reset successfully.', true);
                setTimeout(() => {
                    window.location.href = '/pages/login-page.html';
                }, 1800);
            } catch (error) {
                showMessage('An error occurred. Please try again.', false);
            } finally {
                submitButton.disabled = false;
                submitButton.innerHTML = '<span>Reset Password</span>';
            }
        });

        validateToken();
    </script>
</body>

</html>
