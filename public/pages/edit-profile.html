<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealMajor - Edit Profile</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/user-profile-styles.css">
    <link rel="stylesheet" href="/css/home-styles.css">
    <link rel="stylesheet" href="/css/profile-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script type="module" src="/js/notifications.js"></script>
     <script type="module" src="/js/script-edit-profile.js"></script>
</head>

<body>

    <!--Navigation Bar-->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/pages/home-page.html" class="nav-brand">
                <span class="brand-icon">🍴</span>
                <span class="brand-name">MealMajor</span>
            </a>
            <div class="nav-links">
                <a href="/pages/home-page.html" class="nav-link">Home</a>
                <a href="/pages/recipes.html" class="nav-link">Recipes</a>
                <a href="/pages/meal-planner.html" class="nav-link">Meal Planner</a>
                <a href="/pages/edit-profile.html" class="nav-link active">Profile</a>
                <a href="/pages/user-profile.html" class="nav-link nav-avatar">
                    <div class="avatar-circle" id="avatarNav"></div>
                </a>
                <a href="/pages/login-page.html" class="nav-link logout">Logout</a>
            </div>
        </div>
    </nav>

    <!--Main content-->
    <div class="profile-container">

        <!--Page header-->
        <div class="profile-header">
            <h1>⚙️ Edit Your Profile</h1>
            <p>Update your personal information and dietary preferences</p>
        </div>

        <!--Profile form-->
        <div class="profile-content">

            <form id="profileForm" class="profile-form">

                <!-- Personal info section -->
                <section class="form-section">
                    <h2 class="section-title">Personal Information</h2>

                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" placeholder="Enter your first name" required>
                        <small class="error" id="nameError"></small>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" placeholder="Enter your last name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        <small class="error" id="emailError"></small>
                    </div>
                </section>

                <!-- Health Metrics Section -->
                <section class="form-section health-metrics-section">
                    <h2 class="section-title">Health Information</h2>
                    <p class="section-description">These help us provide better meal recommendations</p>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="editAge">
                                <span class="input-icon">🎂</span>
                                Age
                            </label>
                            <input type="number" id="editAge" name="age" placeholder="Enter your age" min="1" max="120">
                        </div>

                        <div class="form-group">
                            <label for="editWeight">
                                <span class="input-icon">⚖️</span>
                                Weight (kg)
                            </label>
                            <input type="number" id="editWeight" name="weight" placeholder="Enter your weight" min="1"
                                max="300" step="0.1">
                        </div>

                        <div class="form-group">
                            <label for="editHeight">
                                <span class="input-icon">📏</span>
                                Height (cm)
                            </label>
                            <input type="number" id="editHeight" name="height" placeholder="Enter your height" min="50"
                                max="250" step="0.1">
                        </div>
                    </div>
                </section>

                <!--Dietary preference section-->
                <section class="form-section">
                    <h2 class="section-title">Dietary Preference</h2>

                    <div class="form-group">
                        <label>Select Your Diet Type</label>
                        <div class="checkbox-grid">
                            <label class="checkbox-card">
                                <input type="checkbox" name="diet" value="vegetarian">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🥗</span>
                                    <span class="checkbox-label">Vegetarian</span>
                                </span>
                            </label>
                            <label class="checkbox-card">
                                <input type="checkbox" name="diet" value="vegan">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🌱</span>
                                    <span class="checkbox-label">Vegan</span>
                                </span>
                            </label>
                            <label class="checkbox-card">
                                <input type="checkbox" name="diet" value="gluten-free">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🌾</span>
                                    <span class="checkbox-label">Gluten-Free</span>
                                </span>
                            </label>
                            <label class="checkbox-card">
                                <input type="checkbox" name="diet" value="dairy-free">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🥛</span>
                                    <span class="checkbox-label">Dairy-Free</span>
                                </span>
                            </label>
                            <label class="checkbox-card">
                                <input type="checkbox" name="diet" value="halal">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🕌</span>
                                    <span class="checkbox-label">Halal</span>
                                </span>
                            </label>
                            <label class="checkbox-card">
                                <input type="checkbox" name="diet" value="high-protein">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🥚</span>
                                    <span class="checkbox-label">High-Protein</span>
                                </span>
                            </label>
                        </div>
                    </div>
                </section>

                <!--Allergies section-->
                <section class="form-section">
                    <h2 class="section-title">Allergies & Restrictions</h2>

                    <div class="form-group">
                        <label>Select Your Food Allergens</label>
                        <div class="checkbox-grid">
                            <label class="checkbox-card allergen">
                                <input type="checkbox" name="allergy" value="peanuts">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🥜</span>
                                    <span class="checkbox-label">Peanuts</span>
                                </span>
                            </label>
                            <label class="checkbox-card allergen">
                                <input type="checkbox" name="allergy" value="tree-nuts">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🌰</span>
                                    <span class="checkbox-label">Tree Nuts</span>
                                </span>
                            </label>
                            <label class="checkbox-card allergen">
                                <input type="checkbox" name="allergy" value="dairy">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🥛</span>
                                    <span class="checkbox-label">Dairy</span>
                                </span>
                            </label>
                            <label class="checkbox-card allergen">
                                <input type="checkbox" name="allergy" value="eggs">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🥚</span>
                                    <span class="checkbox-label">Eggs</span>
                                </span>
                            </label>
                            <label class="checkbox-card allergen">
                                <input type="checkbox" name="allergy" value="soy">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🫘</span>
                                    <span class="checkbox-label">Soy</span>
                                </span>
                            </label>
                            <label class="checkbox-card allergen">
                                <input type="checkbox" name="allergy" value="wheat">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🌾</span>
                                    <span class="checkbox-label">Wheat</span>
                                </span>
                            </label>
                            <label class="checkbox-card allergen">
                                <input type="checkbox" name="allergy" value="fish">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🐟</span>
                                    <span class="checkbox-label">Fish</span>
                                </span>
                            </label>
                            <label class="checkbox-card allergen">
                                <input type="checkbox" name="allergy" value="shellfish">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🦐</span>
                                    <span class="checkbox-label">Shellfish</span>
                                </span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="otherAllergies">Other Allergies or Restrictions</label>
                        <textarea id="otherAllergies" name="otherAllergies" rows="3"
                            placeholder="List any other allergies or dietary restrictions (e.g., sesame, corn, mustard)"></textarea>
                    </div>
                </section>

                <!--Recipe preferences section-->
                <section class="form-section">
                    <h2 class="section-title">Additional Preferences</h2>

                    <div class="form-group">
                        <label for="cookingSkill">Cooking Skill Level</label>
                        <select id="cookingSkill" name="cookingSkill">
                            <option value="">Select your skill level</option>
                            <option value="beginner">Beginner - I'm just starting out</option>
                            <option value="intermediate">Intermediate - I can follow recipes well</option>
                            <option value="advanced">Advanced - I can improvise and experiment</option>
                            <option value="expert">Expert - I'm a confident cook</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="mealPrepTime">Preferred Meal Prep Time</label>
                        <select id="mealPrepTime" name="mealPrepTime">
                            <option value="">Select prep time preference</option>
                            <option value="quick">Quick (Under 15 minutes)</option>
                            <option value="moderate">Moderate (15-30 minutes)</option>
                            <option value="extended">Extended (30-60 minutes)</option>
                            <option value="elaborate">Elaborate (Over 60 minutes)</option>
                            <option value="any">Any duration is fine</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="budgetRange">Budget Range</label>
                        <select id="budgetRange" name="budgetRange">
                            <option value="">Select your budget preference</option>
                            <option value="low">Low - Budget-friendly meals</option>
                            <option value="medium">Medium - Balanced cost and quality</option>
                            <option value="high">High - Premium ingredients welcome</option>
                        </select>
                    </div>
                </section>

                <!--Action buttons-->
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="window.location.href='/pages/home-page.html'">
                        Cancel
                    </button>
                    <button type="submit" class="cssbuttons-io-button">
                        <span>Save Changes</span>
                    </button>
                </div>

            </form>

        </div>

    </div>

</body>

</html>
