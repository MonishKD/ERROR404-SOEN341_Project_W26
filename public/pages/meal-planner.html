        <link rel="stylesheet" href="/css/styles.css">
        <link rel="stylesheet" href="/css/user-profile-styles.css">
        <link rel="stylesheet" href="/css/home-styles.css">
        <link rel="stylesheet" href="/css/profile-styles.css">
        <link rel="stylesheet" href="/css/planner-styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <script type="module" src="/js/script-meal-planner.js" defer></script>
</head>
<body>

    <!--Navigation bar-->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/pages/home-page.html" class="nav-brand">
                <span class="brand-icon">🍴</span>
                <span class="brand-name">MealMajor</span>
            </a>
            <div class="nav-links">
                <a href="/pages/home-page.html" class="nav-link">Home</a>
                <a href="/pages/recipes.html" class="nav-link">Recipes</a>
                <a href="/pages/meal-planner.html" class="nav-link active">Meal Planner</a>
                <a href="/pages/edit-profile.html" class="nav-link">Profile</a>
                <a href="/pages/user-profile.html" class="nav-link nav-avatar">
                    <div class="avatar-circle" id="avatarNav"></div>
                </a>
                <a href="/pages/login-page.html" class="nav-link logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="profile-container">

        <!--Page header-->
        <div class="profile-header">
            <h1>📅 Weekly Meal Planner</h1>
            <p>Plan your meals for the week ahead</p>
        </div>

        <!--Week controls-->
        <div class="planner-controls">
            <div class="planner-week-row">
                <button class="week-nav-btn">&#8249;</button>
                <div class="planner-week-label" id="mealplanWeekDate"></div>
                <button class="week-nav-btn">&#8250;</button>
                <input type="date" id="weekPicker" class="week-date-input">
            </div>
        </div>    
        
        <!--Weekly grid-->
        <div class="planner-grid-wrapper">
            <div class="planner-grid"></div>
        </div>        

    </div>
