<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner Login</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script type="module" src="/js/notifications.js"></script>
    <script type="module" src="/js/script-login-page.js"></script>
</head>

<body>

    <div class="page">

        <div class="card">

            <!-- Header image section -->
            <div class="card-header">
                <div class="overlay">
                    <div class="header-icon">🍴</div>
                    <h1>Welcome to MealMajor</h1>
                    <p>Your personalized meal plans, one click at a time</p>
                </div>
            </div>

            <!-- Form section -->
            <div class="card-body">

                <p class="subtitle">👨‍🍳 Log in to continue your meal planning journey!</p>

                <form>

                    <label>Email address</label>
                    <input type="email" placeholder="Enter your email address">

                    <div class="password-row">
                        <label>Password</label>
                        <a href="/pages/forgot-password.html">Forgot password?</a>
                    </div>

                    <input type="password" placeholder="Enter your password">

                    <div class="remember">
                        <input type="checkbox" id="remember-me">
                        <label for="remember-me">Remember me</label>
                    </div>

                    <button class="cssbuttons-io-button" type="submit">
                        <span>Sign In</span>
                    </button>
                </form>

                <p class="create">
                    Don't have an account? <a href="/signup">Create account</a> <!-- Go to sign-up page -->
                </p>

            </div>

        </div>

    </div>

</body>

</html>
