<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealMajor - Forgot Password</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="page">
        <div class="card">
            <div class="card-header">
                <div class="overlay">
                    <div class="header-icon">🔐</div>
                    <h1>Reset Password</h1>
                    <p>We'll send you a reset link</p>
                </div>
            </div>

            <div class="card-body">
                <p class="subtitle">📧 Enter your email address</p>

                <form id="forgotPasswordForm">
                    <label>Email address</label>
                    <input type="email" id="email" placeholder="Enter your email address" required>

                    <button class="cssbuttons-io-button" type="submit">
                        <span>Send Reset Link</span>
                    </button>
                </form>

                <div id="message" style="display: none; padding: 15px; border-radius: 8px; margin-top: 20px;"></div>

                <p class="create">
                    <a href="/pages/login-page.html">← Back to Login</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const submitButton = document.querySelector('button[type="submit"]');
            const messageDiv = document.getElementById('message');

            // Disable button
            submitButton.disabled = true;
            submitButton.innerHTML = '<span>Sending...</span>';

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                // Show message
                messageDiv.style.display = 'block';
                messageDiv.style.background = '#e6f4ec';
                messageDiv.style.color = '#0e9c50';
                messageDiv.textContent = data.message;

                // Clear form
                document.getElementById('email').value = '';

            } catch (error) {
                messageDiv.style.display = 'block';
                messageDiv.style.background = '#fee';
                messageDiv.style.color = '#dc2626';
                messageDiv.textContent = 'An error occurred. Please try again.';
            } finally {
                // Re-enable button
                submitButton.disabled = false;
                submitButton.innerHTML = '<span>Send Reset Link</span>';
            }
        });
    </script>
</body>

</html>
