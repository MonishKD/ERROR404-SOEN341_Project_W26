<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealMajor - Create Recipe</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/user-profile-styles.css">
    <link rel="stylesheet" href="/css/home-styles.css">
    <link rel="stylesheet" href="/css/profile-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script type="module" src="/js/notifications.js"></script>
     <script type="module" src="/js/script-create-recipe.js"></script>
</head>

<body>

    <!--Navigation bar-->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/pages/home-page.html" class="nav-brand">
                <span class="brand-icon">🍴</span>
                <span class="brand-name">MealMajor</span>
            </a>
            <div class="nav-links">
                <a href="/pages/home-page.html" class="nav-link">Home</a>
                <a href="/pages/recipes.html" class="nav-link active">Recipes</a>
                <a href="/pages/meal-planner.html" class="nav-link">Meal Planner</a>
                <a href="/pages/edit-profile.html" class="nav-link">Profile</a>
                <a href="/pages/user-profile.html" class="nav-link nav-avatar">
                    <div class="avatar-circle" id="avatarNav"></div>
                </a>
                <a href="/pages/login-page.html" class="nav-link logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="profile-container">

        <!--Page header-->
        <div class="profile-header">
            <h1>🍳 Create a Recipe</h1>
            <p>Fill in the details for your new recipe</p>
        </div>

        <div class="profile-content">
            <form id="createRecipeForm" class="profile-form">

                <!--Basic infos-->
                <section class="form-section">
                    <h2 class="section-title">Basic Info</h2>

                    <div class="form-group">
                        <label for="recipeName">Recipe Name</label>
                        <input type="text" id="recipeName" name="recipeName" placeholder="e.g. Spicy Chicken Stir Fry"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="prepTime">Prep Time (minutes)</label>
                        <input type="number" id="prepTime" name="prepTime" placeholder="e.g. 30" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="difficulty">Difficulty</label>
                        <select id="difficulty" name="difficulty">
                            <option value="">Select difficulty</option>
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="cost">Cost</label>
                        <select id="cost" name="cost">
                            <option value="">Select cost range</option>
                            <option value="low">💰 Low</option>
                            <option value="medium">💰💰 Medium</option>
                            <option value="high">💰💰💰 High</option>
                        </select>
                    </div>
                </section>

                <!--Dietary tags-->
                <section class="form-section">
                    <h2 class="section-title">Dietary Tags</h2>
                    <div class="form-group">
                        <label>Select all that apply</label>
                        <div class="checkbox-grid">
                            <label class="checkbox-card">
                                <input type="checkbox" name="diet" value="gluten-free">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🌾</span>
                                    <span class="checkbox-label">Gluten-Free</span>
                                </span>
                            </label>
                            <label class="checkbox-card">
                                <input type="checkbox" name="diet" value="dairy-free">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🥛</span>
                                    <span class="checkbox-label">Dairy-Free</span>
                                </span>
                            </label>
                            <label class="checkbox-card">
                                <input type="checkbox" name="diet" value="nut-free">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🥜</span>
                                    <span class="checkbox-label">Nut-Free</span>
                                </span>
                            </label>
                            <label class="checkbox-card">
                                <input type="checkbox" name="diet" value="vegan">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🌱</span>
                                    <span class="checkbox-label">Vegan</span>
                                </span>
                            </label>
                            <label class="checkbox-card">
                                <input type="checkbox" name="diet" value="vegetarian">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🥗</span>
                                    <span class="checkbox-label">Vegetarian</span>
                                </span>
                            </label>
                            <label class="checkbox-card">
                                <input type="checkbox" name="diet" value="halal">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🕌</span>
                                    <span class="checkbox-label">Halal</span>
                                </span>
                            </label>
                        </div>
                    </div>
                </section>

                 <!--Allergens tags-->
                <section class="form-section">
                    <h2 class="section-title">Allergens</h2>
                    <div class="form-group">
                        <label>Select all that apply</label>
                        <div class="checkbox-grid">
                            <label class="checkbox-card">
                                <input type="checkbox" name="allergy" value="peanuts">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🥜</span>
                                    <span class="checkbox-label">Peanuts</span>
                                </span>
                            </label>

                            <label class="checkbox-card">
                                <input type="checkbox" name="allergy" value="tree-nuts">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🌰</span>
                                    <span class="checkbox-label">Tree Nuts</span>
                                </span>
                            </label>

                            <label class="checkbox-card">
                                <input type="checkbox" name="allergy" value="dairy">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🥛</span>
                                    <span class="checkbox-label">Dairy</span>
                                </span>
                            </label>

                            <label class="checkbox-card">
                                <input type="checkbox" name="allergy" value="eggs">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🥚</span>
                                    <span class="checkbox-label">Eggs</span>
                                </span>
                            </label>

                            <label class="checkbox-card">
                                <input type="checkbox" name="allergy" value="soy">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🫘</span>
                                    <span class="checkbox-label">Soy</span>
                                </span>
                            </label>

                            <label class="checkbox-card">
                                <input type="checkbox" name="allergy" value="wheat">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🌾</span>
                                    <span class="checkbox-label">Wheat</span>
                                </span>
                            </label>

                            <label class="checkbox-card">
                                <input type="checkbox" name="allergy" value="fish">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🐟</span>
                                    <span class="checkbox-label">Fish</span>
                                </span>
                            </label>

                            <label class="checkbox-card">
                                <input type="checkbox" name="allergy" value="shellfish">
                                <span class="checkbox-content">
                                    <span class="checkbox-icon">🦐</span>
                                    <span class="checkbox-label">Shellfish</span>
                                </span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="otherAllergies">Other Allergies (optional)</label>
                        <input
                            type="text"
                            id="otherAllergies"
                            name="otherAllergies"
                            placeholder="e.g. sesame, mustard"
                        >
                    </div>
                </section>

                <!--Ingredients-->
                <section class="form-section">
                    <h2 class="section-title">Ingredients</h2>
                    <div class="form-group">
                        <label for="ingredients">List your ingredients</label>
                        <textarea id="ingredients" name="ingredients" rows="5"
                            placeholder="e.g. 2 chicken breasts&#10;1 tbsp olive oil&#10;3 cloves garlic&#10;Salt and pepper to taste"
                            required></textarea>
                    </div>
                </section>

                <!--Steps-->
                <section class="form-section">
                    <h2 class="section-title">Preparation Steps</h2>
                    <div class="form-group">
                        <label for="steps">Write your steps in order</label>
                        <textarea id="steps" name="steps" rows="8"
                            placeholder="e.g. Step 1: Heat oil in a pan over medium heat&#10;Step 2: Season chicken with salt and pepper&#10;Step 3: Cook chicken 5-6 min per side"
                            required></textarea>
                    </div>
                </section>

                <!--Action buttons-->
                <div class="form-actions">
                    <button type="button" class="btn-secondary"
                        onclick="window.location.href='/pages/recipes.html'">Cancel</button>
                    <button type="submit">Save Recipe</button>
                </div>

            </form>
        </div>

    </div>

</body>

</html>
